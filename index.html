<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Expires" content="0">
		<script src="coi-serviceworker.js"></script>
		<title>Of Depths Calling</title>
		<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
	width: 100%; height: 100%;
	background: #000;
	overflow: hidden;
}

#canvas {
	display: block;
	position: absolute;
	top: 0; left: 0;
	width: 100%; height: 100%;
}

#canvas:focus { outline: none; }

#load-screen {
	position: fixed;
	inset: 0;
	background: #0d0a18;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	z-index: 100;
	font-family: Arial, sans-serif;
	color: white;
}

#load-title {
	font-size: 2.2rem;
	font-weight: bold;
	color: #f0d040;
	letter-spacing: 4px;
	margin-bottom: 8px;
}

#load-sub {
	font-size: 0.95rem;
	color: #8877bb;
	margin-bottom: 32px;
}

#load-bar-wrap {
	width: 300px; height: 8px;
	background: #1e1630;
	border-radius: 4px;
	overflow: hidden;
	margin-bottom: 12px;
}

#load-bar {
	height: 100%; width: 0%;
	background: #9944ff;
	border-radius: 4px;
	transition: width 0.1s;
}

#load-pct {
	font-size: 0.85rem;
	color: #6655aa;
	margin-bottom: 28px;
}

#play-btn {
	display: none;
	padding: 12px 48px;
	font-size: 1.1rem;
	font-weight: bold;
	letter-spacing: 3px;
	color: #fff;
	background: #5522aa;
	border: 2px solid #9955ff;
	border-radius: 6px;
	cursor: pointer;
}

#play-btn:hover { background: #7733cc; }

#err-box {
	display: none;
	position: fixed;
	top: 12px; left: 50%;
	transform: translateX(-50%);
	background: #661111;
	border: 1px solid #ff3333;
	border-radius: 6px;
	color: #fff;
	padding: 10px 18px;
	font-size: 0.82rem;
	font-family: monospace;
	z-index: 200;
	max-width: 90vw;
	white-space: pre-wrap;
	word-break: break-word;
}
		</style>
		<link rel="icon" type="image/png" href="index.icon.png">
		<link rel="apple-touch-icon" href="index.apple-touch-icon.png">
	</head>
	<body>
		<canvas id="canvas">Your browser does not support canvas.</canvas>

		<div id="load-screen">
			<div id="load-title">OF FINAL DEPTHS</div>
			<div id="load-sub">a metroidvania</div>
			<div id="load-bar-wrap"><div id="load-bar"></div></div>
			<div id="load-pct">0%</div>
			<button id="play-btn" onclick="launchGame()">PLAY</button>
		</div>

		<div id="err-box"></div>

		<script src="index.js?v=13"></script>
		<script>
var GODOT_CONFIG = {
	"args": [],
	"canvasResizePolicy": 2,
	"emscriptenPoolSize": 8,
	"ensureCrossOriginIsolationHeaders": false,
	"executable": "index",
	"experimentalVK": false,
	"fileSizes": {"index.pck": 746084, "index.wasm": 37695054},
	"focusCanvas": true,
	"gdextensionLibs": [],
	"godotPoolSize": 4,
	"serviceWorker": "coi-serviceworker.js"
};
var GODOT_THREADS_ENABLED = false;

var _ready = false;

function showErr(msg) {
	var b = document.getElementById('err-box');
	if (!b) return;
	b.textContent = (b.textContent ? b.textContent + '\n' : '') + msg;
	b.style.display = 'block';
	console.error(msg);
}

window.onerror = function(msg, src, line) {
	showErr('Error: ' + msg + (src ? ' (' + src + ':' + line + ')' : ''));
};
window.onunhandledrejection = function(e) {
	showErr('Error: ' + (e.reason || 'unknown rejection'));
};

function launchGame() {
	var ls = document.getElementById('load-screen');
	if (ls) ls.style.display = 'none';
	var c = document.getElementById('canvas');
	if (c) c.focus();
}

(function() {
	if (typeof Engine === 'undefined') {
		showErr('index.js failed to load. Try Ctrl+Shift+R to hard refresh.');
		return;
	}

	var engine = new Engine(GODOT_CONFIG);

	var bar = document.getElementById('load-bar');
	var pct = document.getElementById('load-pct');
	var btn = document.getElementById('play-btn');

	var missing = Engine.getMissingFeatures({threads: GODOT_THREADS_ENABLED});
	if (missing.length > 0) {
		showErr('Browser is missing: ' + missing.join(', '));
	}

	engine.startGame({
		onProgress: function(current, total) {
			if (total > 0) {
				var p = Math.round(current / total * 100);
				if (bar) bar.style.width = p + '%';
				if (pct) pct.textContent = p + '%';
			}
		},
		print: function(text) { console.log('[GD]', text); },
		printErr: function(text) {
			console.error('[GD ERR]', text);
			if (text) {
				var low = text.toLowerCase();
				if (low.indexOf('error') !== -1 || low.indexOf('invalid') !== -1 || low.indexOf('script') !== -1 || low.indexOf('failed') !== -1 || low.indexOf('cannot') !== -1) {
					showErr('[Game] ' + text);
				}
			}
		}
	}).then(function() {
		_ready = true;
		if (pct) pct.textContent = 'Ready!';
		if (btn) btn.style.display = 'block';
	}).catch(function(err) {
		showErr('Start failed: ' + (err && err.message ? err.message : String(err)));
	});

	setTimeout(function() {
		if (!_ready) {
			showErr('Still loading after 2 min — try Ctrl+Shift+R (hard refresh)');
		}
	}, 120000);
}());
		</script>
	</body>
</html>
