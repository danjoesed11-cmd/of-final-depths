<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<script src="coi-serviceworker.js"></script>
		<title>Of Depths Calling</title>
		<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
	color: white;
	background-color: #0a0812;
	overflow: hidden;
	touch-action: none;
	width: 100vw;
	height: 100vh;
}

#canvas {
	display: block;
	width: 100%;
	height: 100%;
	position: absolute;
	top: 0; left: 0;
}

#canvas:focus { outline: none; }

/* Loading overlay */
#load-screen {
	position: fixed;
	inset: 0;
	background: #0a0812;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	z-index: 100;
	font-family: 'Segoe UI', Arial, sans-serif;
}

#load-title {
	font-size: 2.4rem;
	font-weight: bold;
	color: #f5d842;
	letter-spacing: 0.12em;
	margin-bottom: 0.5rem;
	text-shadow: 0 0 24px #f5d84280;
}

#load-sub {
	font-size: 1rem;
	color: #8877bb;
	margin-bottom: 2.5rem;
	letter-spacing: 0.06em;
}

#load-bar-wrap {
	width: 320px;
	height: 10px;
	background: #1e1630;
	border-radius: 6px;
	overflow: hidden;
	margin-bottom: 1rem;
}

#load-bar {
	height: 100%;
	width: 0%;
	background: linear-gradient(90deg, #6633cc, #cc44ff);
	border-radius: 6px;
	transition: width 0.15s ease;
}

#load-text {
	font-size: 0.85rem;
	color: #6655aa;
	letter-spacing: 0.08em;
	margin-bottom: 2rem;
	animation: pulse 1.6s ease-in-out infinite;
}

@keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

#play-btn {
	display: none;
	padding: 0.85rem 3rem;
	font-size: 1.2rem;
	font-weight: bold;
	letter-spacing: 0.15em;
	color: #fff;
	background: linear-gradient(135deg, #3a1a6e, #7722cc);
	border: 2px solid #aa55ff;
	border-radius: 8px;
	cursor: pointer;
	box-shadow: 0 0 24px #7722cc88;
	transition: transform 0.1s, box-shadow 0.1s;
}

#play-btn:hover {
	transform: scale(1.05);
	box-shadow: 0 0 36px #aa55ffcc;
}

#error-box {
	display: none;
	position: fixed;
	top: 16px;
	left: 50%;
	transform: translateX(-50%);
	background: #5b1a1a;
	border: 1px solid #dd3333;
	border-radius: 8px;
	color: #fff;
	padding: 0.75rem 1.25rem;
	font-size: 0.9rem;
	font-family: monospace;
	z-index: 999;
	max-width: 90vw;
	word-break: break-word;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
		<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
	</head>
	<body>
		<canvas id="canvas">Your browser does not support the canvas element.</canvas>

		<noscript>JavaScript is required to play this game.</noscript>

		<div id="load-screen">
			<div id="load-title">OF FINAL DEPTHS</div>
			<div id="load-sub">a metroidvania</div>
			<div id="load-bar-wrap"><div id="load-bar"></div></div>
			<div id="load-text" id="load-text">Loading...</div>
			<button id="play-btn" onclick="startGame()">▶  PLAY</button>
		</div>

		<div id="error-box"></div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":744804,"index.wasm":37695054},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"coi-serviceworker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

var _gameReady = false;

function showError(msg) {
	var eb = document.getElementById('error-box');
	if (eb) { eb.textContent = msg; eb.style.display = 'block'; }
	console.error(msg);
}

window.addEventListener('error', function(e) {
	showError('JS Error: ' + (e.message || String(e)));
});
window.addEventListener('unhandledrejection', function(e) {
	showError('Error: ' + (e.reason || 'unknown'));
});

function startGame() {
	var ls = document.getElementById('load-screen');
	if (ls) ls.remove();
	var canvas = document.getElementById('canvas');
	if (canvas) { canvas.focus(); canvas.click(); }
}

(function() {
	var loadBar  = document.getElementById('load-bar');
	var loadText = document.getElementById('load-text');
	var playBtn  = document.getElementById('play-btn');

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });

	if (missing.length !== 0) {
		if (loadText) loadText.textContent = 'Missing: ' + missing.join(', ');
		showError('Browser missing required features: ' + missing.join(', '));
		return;
	}

	engine.startGame({
		onProgress: function(current, total) {
			if (total > 0 && loadBar) {
				loadBar.style.width = Math.round(current / total * 100) + '%';
			}
		}
	}).then(function() {
		_gameReady = true;
		if (loadText) loadText.style.display = 'none';
		if (playBtn)  { playBtn.style.display = 'block'; playBtn.focus(); }
	}).catch(function(err) {
		showError('Failed to start: ' + (err && err.message ? err.message : String(err)));
	});

	// Hard fallback: if promise never settles after 120s, show a reload hint
	setTimeout(function() {
		if (!_gameReady) {
			showError('Stuck loading — try Ctrl+Shift+R (hard refresh) to clear the cache.');
		}
	}, 120000);
}());
		</script>
	</body>
</html>
