<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Expires" content="0">
		<script src="coi-serviceworker.js"></script>
		<title>Of Depths Calling</title>
		<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
	width: 100%; height: 100%;
	background: #000;
	overflow: hidden;
}

#canvas {
	display: block;
	position: absolute;
	top: 0; left: 0;
	width: 100%; height: 100%;
}

#canvas:focus { outline: none; }

#load-screen {
	position: fixed;
	inset: 0;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	background: #050310;
	z-index: 9999;
	font-family: 'Segoe UI', sans-serif;
	color: #c8b8f0;
	transition: opacity 0.6s ease;
}

#load-screen.fade-out { opacity: 0; pointer-events: none; }

.ls-title {
	font-size: clamp(28px, 5vw, 52px);
	font-weight: 900;
	letter-spacing: 0.18em;
	text-transform: uppercase;
	color: #a06cff;
	text-shadow: 0 0 28px #7c3dffcc, 0 0 6px #fff4;
	margin-bottom: 10px;
}

.ls-sub {
	font-size: clamp(11px, 1.8vw, 15px);
	letter-spacing: 0.22em;
	color: #7a6aaa;
	margin-bottom: 44px;
	text-transform: uppercase;
}

.ls-bar-wrap {
	width: min(460px, 80vw);
	height: 7px;
	background: #1a1030;
	border-radius: 6px;
	overflow: hidden;
	margin-bottom: 14px;
	box-shadow: 0 0 12px #5c2fff55;
}

.ls-bar {
	height: 100%;
	width: 0%;
	background: linear-gradient(90deg, #5c2fff, #a06cff, #c86cff);
	border-radius: 6px;
	transition: width 0.25s ease;
	box-shadow: 0 0 10px #a06cffaa;
}

.ls-pct {
	font-size: 13px;
	color: #9070d0;
	letter-spacing: 0.12em;
	margin-bottom: 30px;
}

.ls-hint {
	font-size: clamp(10px, 1.4vw, 13px);
	color: #5a4880;
	letter-spacing: 0.10em;
	font-style: italic;
}

.ls-stars {
	position: absolute;
	inset: 0;
	pointer-events: none;
	overflow: hidden;
}

.ls-star {
	position: absolute;
	border-radius: 50%;
	background: #fff;
	opacity: 0;
	animation: twinkle 3s infinite ease-in-out;
}

@keyframes twinkle {
	0%, 100% { opacity: 0; transform: scale(0.6); }
	50%       { opacity: 0.7; transform: scale(1.2); }
}
		</style>
	</head>
	<body>

<div id="load-screen">
	<div class="ls-stars" id="ls-stars"></div>
	<div class="ls-title">Of Depths Calling</div>
	<div class="ls-sub">Enter the dungeon &nbsp;·&nbsp; Survive the dark</div>
	<div class="ls-bar-wrap"><div class="ls-bar" id="ls-bar"></div></div>
	<div class="ls-pct" id="ls-pct">Loading…</div>
	<div class="ls-hint" id="ls-hint">Preparing the abyss…</div>
</div>

<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript>Your browser does not support JavaScript.</noscript>

<script>
(function(){
	var stars = document.getElementById('ls-stars');
	for(var i=0;i<55;i++){
		var s=document.createElement('div');
		s.className='ls-star';
		var sz=(Math.random()*2.4+0.8).toFixed(1);
		s.style.cssText='width:'+sz+'px;height:'+sz+'px;top:'+(Math.random()*100)+'%;left:'+(Math.random()*100)+'%;animation-delay:'+(Math.random()*3).toFixed(2)+'s;animation-duration:'+(2+Math.random()*2).toFixed(2)+'s';
		stars.appendChild(s);
	}
	var hints=['Sharpening blades…','Waking the dungeon…','Counting the bones…','Charging the arcane…','Polishing the spear…','Binding the shadows…','Brewing potions…','Summoning allies…','Sealing the void…','Loading darkness…'];
	document.getElementById('ls-hint').textContent=hints[Math.floor(Math.random()*hints.length)];
})();
</script>

		<script src="index.js?v=32"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":990568,"index.wasm":37695054},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	var bar    = document.getElementById('ls-bar');
	var pct    = document.getElementById('ls-pct');
	var screen = document.getElementById('load-screen');

	engine.startGame({
		'onProgress': function (current, total) {
			if (total > 0) {
				var p = Math.round(current / total * 100);
				bar.style.width = p + '%';
				pct.textContent = p + '%';
			}
		},
	}).then(function () {
		bar.style.width = '100%';
		pct.textContent = '100%';
		setTimeout(function(){
			screen.classList.add('fade-out');
			setTimeout(function(){ screen.remove(); }, 650);
		}, 300);
	}).catch(function (err) {
		pct.textContent = 'Failed to load: ' + (err.message || err);
		bar.style.background = '#ff4444';
		console.error(err);
	});
}());
		</script>
	</body>
</html>
